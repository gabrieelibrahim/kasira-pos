# Kasira HTTPS domain — CLOUD-MODE nginx config.
#
# Since 2026-08-08 the RLS/Supabase-Auth migration, the client bundle is a
# CLOUD-MODE build (VITE_USE_PROXY=0) that talks DIRECTLY to
# https://cqugtfkxcbnseaefaswq.supabase.co (Auth + REST + realtime all come
# from Supabase Cloud). The old /api + /realtime proxy locations (which
# forwarded to the self-hosted Kong on 127.0.0.1:8000) are REMOVED — the VPS
# backend is no longer in the request path.
#
# To apply: replace the proxy locations in /etc/nginx/sites-available/
# kasira-subdomain with the server block below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Keep the static-serving + cache headers from the original config (index.html
# no-cache, /assets immutable 30d). Only the /api and /realtime blocks change.

server {
  listen 443 ssl http2;
  server_name kasira.gabriellabs.my.id;

  # --- TLS (unchanged from original; adjust cert paths to yours) ---
  ssl_certificate     /etc/letsencrypt/live/kasira.gabriellabs.my.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kasira.gabriellabs.my.id/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /var/www/kasira;
  index index.html;

  # index.html must always revalidate (Vite emits content-hashed assets, but
  # index.html must pick up the new JS hash after every deploy).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Vite content-hashed assets — cache immutably.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # NO /api, NO /realtime proxy — the cloud-mode bundle calls Supabase Cloud
  # directly. Remove any such blocks here.
}
